# Kafka UI — visual topic/message browser for the Strimzi-managed Kafka cluster.
# Exposed via LoadBalancer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "fraud-kafka"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "fraud-kafka-kafka-bootstrap:9092"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: fraud-detection
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8090
      targetPort: 8080
  type: LoadBalancer