apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: fraud-detection
  labels:
    strimzi.io/cluster: fraud-kafka
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 2Gi
    class: standard-rwo
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: fraud-detection
  labels:
    strimzi.io/cluster: fraud-kafka
spec:
  replicas: 1
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 3Gi
    class: standard-rwo
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: fraud-kafka
  namespace: fraud-detection
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false

  entityOperator:
    topicOperator: {}
    userOperator: {}